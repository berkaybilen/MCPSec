id: DEMO-003
name: Credential Leak Is Redacted
description: >
  Simulates a tool returning a response that contains an API key
  (sk-DEMOSECRET...). MCPSec detects the credential pattern in the
  response and replaces it with [REDACTED] before forwarding to the
  client — the raw secret never leaves the proxy.
steps:
  - tool: leak_demo_secret
    expect_response:
      text_contains: "[REDACTED]"
      text_not_contains: "sk-DEMOSECRET1234567890"
expect:
  session_state: SAFE
  events:
    - tool: leak_demo_secret
      direction: response
      decision: alert
      flags_include: [credential_leak]
