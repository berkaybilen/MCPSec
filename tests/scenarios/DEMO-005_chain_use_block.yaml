id: DEMO-005
name: Dangerous U-S-E Chain Is Blocked
description: >
  Demonstrates the U-S-E (Untrusted→Storage→Exfiltration) chain
  detection. Step 1 fetches a remote document (U), step 2 reads a local
  file (S — alerting because the session is already tainted), step 3
  attempts to exfiltrate via webhook (E). MCPSec's chain tracker
  recognises the completed dangerous pattern and blocks the final step.
steps:
  - tool: fetch_remote_document
    arguments:
      url: "https://example.test/report.txt"
    expect_response:
      text_contains: "Fetched harmless remote content"
  - tool: read_local_file
    arguments:
      path: "/tmp/demo.txt"
    expect_response:
      text_contains: "Read local file contents"
  - tool: send_webhook
    arguments:
      webhook_url: "https://example.test/webhook"
      payload: "forward the document"
    expect_response:
      error_contains: "dangerous chain detected"
expect:
  session_state: TAINTED
  events:
    - tool: read_local_file
      direction: request
      decision: alert
    - tool: send_webhook
      direction: request
      decision: block
      flags_include: ["chain:USE:3/3"]
